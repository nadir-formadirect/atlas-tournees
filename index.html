}

.leaflet-container.leaflet-touch-zoom {
	-ms-touch-action: pan-x pan-y;

	touch-action: none;

}

	touch-action: none;
}

}

}

	}

	}

.leaflet-overlay-pane svg {

.leaflet-tile-pane    { z-index: 200; }

	position: absolute;

/* control positioning */

.leaflet-control {
	position: relative;
	z-index: 800;
	pointer-events: visiblePainted; /* IE 9-10 doesn't have auto */

.leaflet-top,

.leaflet-bottom .leaflet-control {

/* zoom and fade animations */

.leaflet-fade-anim .leaflet-popup {
	opacity: 0;
	-webkit-transition: opacity 0.2s linear;
	   -moz-transition: opacity 0.2s linear;
	        transition: opacity 0.2s linear;
	}
.leaflet-fade-anim .leaflet-map-pane .leaflet-popup {

.leaflet-zoom-anim .leaflet-zoom-animated {

.leaflet-zoom-anim .leaflet-tile,

.leaflet-interactive {

svg.leaflet-image-layer.leaflet-interactive path {

/* general typography */

.leaflet-bar {

/* popup */

.leaflet-popup {

/* Tooltip */
/* Base styles for the element that has a tooltip */
.leaflet-tooltip {
	position: absolute;
	padding: 6px;
	background-color: #fff;
	border: 1px solid #fff;
	border-radius: 3px;
	color: #222;
	white-space: nowrap;

.leaflet-tooltip-bottom:before,

.leaflet-tooltip-right:before {

	pointer-events: none;
	border: 6px solid transparent;
	background: transparent;
	content: "";
	}

/* Directions */

.leaflet-tooltip-bottom {
	margin-top: 6px;
}
.leaflet-tooltip-top {
	margin-top: -6px;
}
.leaflet-tooltip-bottom:before,
.leaflet-tooltip-top:before {
	left: 50%;
	margin-left: -6px;
	}
.leaflet-tooltip-top:before {
	bottom: 0;
	margin-bottom: -12px;

	}
.leaflet-tooltip-bottom:before {

}
.leaflet-tooltip-right {

}
.leaflet-tooltip-left:before,
.leaflet-tooltip-right:before {

<style>
:root{--ink:#0a1520;--deep:#0d2438;--steel:#16394f;--frost:#e8f1f5;--ice:#7fd4e8;--wave:#2b8fa0;--coral:#e8654a;--gold:#f0b429;--mut:#5c7688;--line:#1d4258;--ok:#1f9e6e}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--ink);color:var(--frost);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;height:100%}
body{display:flex;flex-direction:column;overflow:hidden}
header{padding:14px 14px 10px;background:var(--ink);z-index:30;flex-shrink:0}
.brand{display:flex;align-items:baseline;gap:9px;margin-bottom:11px;max-width:820px;margin-left:auto;margin-right:auto}
.brand h1{font-size:18px;font-weight:800;letter-spacing:-.4px;color:#fff}
.brand .sub{font-size:10px;color:var(--ice);font-weight:600;letter-spacing:.5px;text-transform:uppercase}
.brand .days{margin-left:auto;font-size:11px;color:var(--mut)}
.searchbox{position:relative;max-width:820px;margin:0 auto}
#q{width:100%;font-size:18px;font-weight:600;padding:15px 44px 15px 16px;border:2px solid var(--steel);background:var(--deep);color:#fff;border-radius:13px;outline:none}
#q:focus{border-color:var(--ice)}
#q::placeholder{color:#4d6b7d;font-weight:500}
.searchbox .ic{position:absolute;right:15px;top:50%;transform:translateY(-50%);color:var(--ice);font-size:19px;pointer-events:none}
.split{flex:1;display:flex;flex-direction:column;overflow:hidden;position:relative}
#map{width:100%;height:100%;background:#0a1a24;z-index:1}
.leaflet-container{background:#0a1a24}
#panel{position:absolute;left:0;right:0;bottom:0;max-height:62%;background:var(--ink);border-top:1px solid var(--line);border-radius:16px 16px 0 0;z-index:20;display:flex;flex-direction:column;transition:transform .22s ease;box-shadow:0 -10px 30px rgba(0,0,0,.4)}
#panel.hidden{transform:translateY(calc(100% - 52px))}
.grip{padding:10px;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;gap:8px}
.grip .bar{width:38px;height:4px;background:var(--steel);border-radius:3px}
.grip .lab{font-size:11px;color:var(--mut);font-weight:600}
.scroll{overflow-y:auto;padding:0 12px 20px;-webkit-overflow-scrolling:touch}
.results{max-width:820px;margin:0 auto;display:flex;flex-direction:column;gap:9px}
.card{background:var(--deep);border:1px solid var(--steel);border-radius:13px;overflow:hidden}
.card .top{padding:13px 15px;display:flex;align-items:flex-start;gap:11px}
.kind{font-size:10px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;padding:4px 8px;border-radius:6px;white-space:nowrap;margin-top:2px}
.k-com{background:rgba(127,212,232,.16);color:var(--ice)}
.k-cli{background:rgba(240,180,41,.16);color:var(--gold)}
.k-tour{background:rgba(43,143,160,.22);color:#8fd7e6}
.card h2{font-size:17px;font-weight:800;color:#fff;letter-spacing:-.3px;line-height:1.2;cursor:pointer}
.card .meta{font-size:12px;color:var(--mut);margin-top:3px}
.tour-line{display:flex;align-items:center;gap:10px;padding:11px 15px;border-top:1px solid var(--steel);cursor:pointer}
.tour-line:active{background:var(--steel)}
.dot{width:11px;height:11px;border-radius:50%;flex-shrink:0}
.code{font-family:ui-monospace,Menlo,monospace;font-size:14px;font-weight:700;color:#fff;background:var(--steel);padding:5px 8px;border-radius:6px;min-width:52px;text-align:center}
.tour-line .nm{font-size:13px;color:var(--frost);font-weight:600;flex:1}
.tour-line .nm small{display:block;color:var(--mut);font-weight:500;font-size:11px;margin-top:1px}
.badge{font-size:9px;font-weight:800;padding:3px 7px;border-radius:20px;letter-spacing:.3px;text-transform:uppercase;white-space:nowrap}
.b-hab{background:rgba(31,158,110,.18);color:#4fd8a0}
.b-freq{background:rgba(127,212,232,.16);color:var(--ice)}
.b-occ{background:rgba(240,180,41,.16);color:var(--gold)}
.b-exc{background:rgba(232,101,74,.18);color:#ff9179}
.b-forte{background:rgba(31,158,110,.18);color:#4fd8a0}
.b-moyenne{background:rgba(240,180,41,.16);color:var(--gold)}
.b-faible{background:rgba(232,101,74,.16);color:#ff9179}
.prio{font-size:9px;font-weight:800;padding:3px 7px;border-radius:5px;background:var(--coral);color:#fff}
.section-lab{font-size:10px;font-weight:700;color:var(--mut);text-transform:uppercase;letter-spacing:.5px;padding:11px 15px 3px}
.unknown{border-color:var(--wave)}
.note{padding:2px 15px 11px;font-size:13px;color:var(--frost);line-height:1.5}
.note b{color:var(--ice)}
.dist{font-size:11px;color:var(--mut);font-family:ui-monospace,monospace;white-space:nowrap}
.empty{text-align:center;padding:26px 20px;color:var(--mut)}
.empty p{font-size:13px;line-height:1.6}
.chips{display:flex;flex-wrap:wrap;gap:7px;justify-content:center;margin-top:14px}
.chip{font-size:13px;padding:8px 13px;background:var(--deep);border:1px solid var(--steel);border-radius:20px;color:var(--ice);cursor:pointer;font-weight:600}
.more{font-size:12px;color:var(--ice);padding:11px 15px;cursor:pointer;border-top:1px solid var(--steel);font-weight:600;text-align:center}
.mk{border:2px solid #fff;border-radius:50%;box-shadow:0 0 0 1px rgba(0,0,0,.4)}
.mk-q{width:20px;height:20px;background:#fff;border:3px solid var(--coral);box-shadow:0 0 12px var(--coral)}
.leaflet-popup-content-wrapper{background:var(--deep);color:var(--frost);border-radius:9px}
.leaflet-popup-tip{background:var(--deep)}
.leaflet-popup-content{margin:9px 12px;font-size:13px}
.leaflet-popup-content b{color:#fff}
.pill{position:absolute;top:10px;left:50%;transform:translateX(-50%);z-index:15;background:var(--deep);border:1px solid var(--steel);border-radius:20px;padding:7px 14px;font-size:12px;font-weight:600;color:var(--frost);box-shadow:0 4px 14px rgba(0,0,0,.4);display:none;align-items:center;gap:8px;max-width:90%}
.pill .x{color:var(--mut);font-weight:800;cursor:pointer;font-size:15px}
.pill .cdot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
</style>
</head>
<body>
<header>
  <div class="brand"><h1>Dispatch</h1><span class="sub">mémoire des tournées</span><span class="days" id="daystamp"></span></div>
  <div class="searchbox"><input id="q" type="search" autocomplete="off" autocorrect="off" spellcheck="false" placeholder="Ville, client, tournée, code postal…" enterkeyhint="search"><span class="ic">⌕</span></div><button class="iconbtn" id="btImport" title="Importer">⭳</button>
</header>
<div class="split">
  <div id="map"></div>
  <div class="pill" id="pill"></div>
  <div class="trace-toggle" id="tracetoggle"><button id="btTrace" class="on">Tracé</button><button id="btTerr">Zone</button></div>
  <div id="panel">
    <div class="grip" id="grip"><div class="bar"></div><span class="lab" id="griplab"></span></div>
    <div class="scroll"><div class="results" id="res"></div></div>
  </div>
</div>

function norm(s){return (s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toUpperCase().replace(/\bSAINTE\b/g,'STE').replace(/\bSAINT\b/g,'ST').replace(/[^A-Z0-9]/g,' ').replace(/\s+/g,' ').trim();}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function dist(a,b,c,d){var R=6371,r=Math.PI/180,dla=(c-a)*r,dlo=(d-b)*r;var h=Math.sin(dla/2)*Math.sin(dla/2)+Math.cos(a*r)*Math.cos(c*r)*Math.sin(dlo/2)*Math.sin(dlo/2);return 2*R*Math.asin(Math.sqrt(h));}
function lev(a,b){var m=a.length,n=b.length;if(Math.abs(m-n)>3)return 9;var d=[];for(var i=0;i<=m;i++){d[i]=[i];for(var j=1;j<=n;j++)d[i][j]=i===0?j:0;}for(i=1;i<=m;i++)for(j=1;j<=n;j++)d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));return d[m][n];}

var GEOT=DB.tournees.filter(function(t){return t.t!=='PLATEFORME'&&t.pts.length>=2;});
function propose(lat,lon){
  var r=GEOT.map(function(t){var dmin=1e9,near=0;t.pts.forEach(function(p){var d=dist(lat,lon,p[0],p[1]);if(d<dmin)dmin=d;if(d<=15)near++;});return{c:t.c,n:t.n,col:t.col,d:dmin,near:near};});
  r.sort(function(a,b){return a.d-b.d||b.near-a.near;});
  return r.slice(0,4).map(function(x){x.conf=x.d<8?'FORTE':x.d<20?'MOYENNE':'FAIBLE';return x;});
}

function run(){
  var raw=q.value.trim();panel.classList.remove('hidden');
  if(!raw){empty();return;}
  var qn=norm(raw),isCP=/^\d{4,5}$/.test(raw),hits=[];
  DB.tournees.forEach(function(t){var s=0,cn=norm(t.c),nn=norm(t.n);if(cn===qn)s=100;else if(cn.indexOf(qn)===0)s=95;else if(nn.indexOf(qn)>=0)s=70;if(s)hits.push({s:s+3,type:'t',o:t});});
  DB.communes.forEach(function(c){var s=0;if(c.nn===qn)s=100;else if(c.nn.indexOf(qn)===0)s=90;else if(c.nn.indexOf(qn)>=0)s=75;else if(qn.split(' ').every(function(w){return c.nn.indexOf(w)>=0;}))s=60;if(isCP&&String(c.cp)===raw)s=100;if(!s&&qn.length>=4){var l=lev(qn,c.nn.split(' ')[0]);if(l<=1)s=55;else if(l<=2)s=40;}if(s)hits.push({s:s,type:'c',o:c});});
  DB.clients.forEach(function(c){var s=0;if(c.nn===qn)s=100;else if(c.nn.indexOf(qn)===0)s=88;else if(c.nn.indexOf(qn)>=0)s=72;else if(qn.split(' ').every(function(w){return c.nn.indexOf(w)>=0;}))s=58;if(!s&&qn.length>=4){var l=lev(qn,c.nn.split(' ')[0]);if(l<=1)s=48;}if(s)hits.push({s:s-2,type:'cl',o:c});});
  hits.sort(function(a,b){return b.s-a.s;});

/* --- CSV --- */
function parseCSV(text){
  var sep = (text.split('\n')[0].split(';').length > text.split('\n')[0].split(',').length) ? ';' : ',';
  var lines=text.replace(/\r/g,'').split('\n').filter(function(l){return l.trim();});
  if(!lines.length)return [];
  var head=lines[0].split(sep).map(function(h){return h.trim().replace(/^"|"$/g,'');});
  return lines.slice(1).map(function(l){
    var cells=l.split(sep).map(function(c){return c.trim().replace(/^"|"$/g,'');});
    var o={};head.forEach(function(h,i){o[h]=cells[i]||'';});return o;
  });
}

/* --- XLSX léger : unzip via DecompressionStream + lecture sheet XML --- */
async function readXlsx(file){
  var buf=await file.arrayBuffer();
  var files=await unzip(new Uint8Array(buf));
  var shared=[];
  if(files['xl/sharedStrings.xml']){
    var sx=new TextDecoder().decode(files['xl/sharedStrings.xml']);
    shared=(sx.match(/<t[^>]*>([\s\S]*?)<\/t>/g)||[]).map(function(t){
      return t.replace(/<[^>]+>/g,'').replace(/&amp;/g,'&').replace(/&lt;/g,'<').replace(/&gt;/g,'>');});
  }
  var sheetName=Object.keys(files).find(function(k){return /xl\/worksheets\/sheet1\.xml/.test(k);});
  if(!sheetName)throw new Error('feuille introuvable');
  var xml=new TextDecoder().decode(files[sheetName]);
  var rows=[];
  (xml.match(/<row[\s\S]*?<\/row>/g)||[]).forEach(function(r){
    var cells=[];
    (r.match(/<c[^>]*?(?:\/>|>[\s\S]*?<\/c>)/g)||[]).forEach(function(c){
      var isStr=/t="s"/.test(c);
      var vm=c.match(/<v>([\s\S]*?)<\/v>/);
      var val=vm?vm[1]:'';
      if(isStr&&val!=='')val=shared[+val]||'';
      cells.push(val);
    });
    rows.push(cells);
  });
  if(!rows.length)return [];
  var head=rows[0];
  return rows.slice(1).map(function(r){var o={};head.forEach(function(h,i){o[h]=r[i]||'';});return o;});
}

/* mini unzip (stored + deflate via DecompressionStream) */
async function unzip(bytes){
  var out={};var dv=new DataView(bytes.buffer);
  // localiser End Of Central Directory
  var i=bytes.length-22;
  while(i>=0 && dv.getUint32(i,true)!==0x06054b50)i--;
  if(i<0)throw new Error('zip invalide');
  var cdOff=dv.getUint32(i+16,true),cdCount=dv.getUint16(i+10,true),p=cdOff;
  for(var n=0;n<cdCount;n++){
    if(dv.getUint32(p,true)!==0x02014b50)break;
    var method=dv.getUint16(p+10,true);
    var compSize=dv.getUint32(p+20,true);
    var nameLen=dv.getUint16(p+28,true),extraLen=dv.getUint16(p+30,true),commLen=dv.getUint16(p+32,true);
    var lho=dv.getUint32(p+42,true);
    var name=new TextDecoder().decode(bytes.subarray(p+46,p+46+nameLen));
    // header local pour offset données
    var lNameLen=dv.getUint16(lho+26,true),lExtra=dv.getUint16(lho+28,true);
    var dataStart=lho+30+lNameLen+lExtra;
    var comp=bytes.subarray(dataStart,dataStart+compSize);
    if(method===0){out[name]=comp;}
    else if(method===8){out[name]=await inflateRaw(comp);}
    p+=46+nameLen+extraLen+commLen;
  }
  return out;
}
async function inflateRaw(bytes){
  var ds=new DecompressionStream('deflate-raw');
  var w=ds.writable.getWriter();w.write(bytes);w.close();
  var chunks=[],reader=ds.readable.getReader();
  while(true){var r=await reader.read();if(r.done)break;chunks.push(r.value);}
  var len=chunks.reduce(function(a,c){return a+c.length;},0),res=new Uint8Array(len),off=0;
  chunks.forEach(function(c){res.set(c,off);off+=c.length;});
  return res;
}

}
async function inflate(bytes){
  // zlib (avec entête) -> DecompressionStream 'deflate'
  try{
    var ds=new DecompressionStream('deflate');
    var w=ds.writable.getWriter();w.write(bytes);w.close();
    var chunks=[],reader=ds.readable.getReader();
    while(true){var r=await reader.read();if(r.done)break;chunks.push(r.value);}
    var len=chunks.reduce(function(a,c){return a+c.length;},0),res=new Uint8Array(len),off=0;
    chunks.forEach(function(c){res.set(c,off);off+=c.length;});return res;
  }catch(e){
    // essayer raw
    return inflateRaw(bytes);
  }
}
function extractTj(content){
  var out='';
  // ( ... ) Tj   et   [ (..) (..) ] TJ
  var re=/\((?:\\.|[^()\\])*\)\s*Tj|\[[^\]]*\]\s*TJ/g,m;
  while((m=re.exec(content))){
    var seg=m[0];
    var strs=seg.match(/\((?:\\.|[^()\\])*\)/g)||[];
    strs.forEach(function(s){
      s=s.slice(1,-1).replace(/\\([()\\])/g,'$1').replace(/\\(\d{3})/g,function(_,o){return String.fromCharCode(parseInt(o,8));});
      out+=s;
    });
    // fin de commande texte = espace; les sauts de ligne viennent des BT/ET, approximés
    out+='\n';
  }
  return out;
}

/* parse texte ELIT -> [{code,name,date,clients:[{dest,dpt,loc}]}] */
function parseElit(txt){
  var lines=txt.split('\n');
  var tours=[],cur=null,curdate=null;
  var reTour=/Tournee\s*:\s*(\S+)\s+(.+)/;
  var reDate=/Date\s*:\s*(\d{2}\/\d{2}\/\d{2})/;
  var reDest=/^(\d{2}\/\d{2}\/\d{2})\s+(.+?)\s+(\d{2})\s+([A-ZÀ-Ÿ0-9' .\-]+?)\s*$/;
  lines.forEach(function(line){
    var l=line.trim();
    var mt=reTour.exec(l);
    if(mt && l.indexOf('Total')<0){
      var name=mt[2].split(/\s{2,}/)[0].trim();
      cur={code:mt[1],name:name,date:curdate,clients:[]};tours.push(cur);
    }
    var md=reDate.exec(l);if(md){curdate=md[1];if(cur&&!cur.date)cur.date=md[1];}
    var mdest=reDest.exec(l);
    if(mdest&&cur){
      cur.clients.push({dest:mdest[2].trim(),dpt:mdest[3],loc:mdest[4].trim()});
    }
  });
  tours.forEach(function(t){if(!t.date)t.date=curdate;
    var seen={},u=[];t.clients.forEach(function(c){var k=c.dest+'|'+c.loc;if(!seen[k]){seen[k]=1;u.push(c);}});t.clients=u;});
  return tours.filter(function(t){return t.clients.length;});
}

/* ---- 5. INTÉGRATION à la base (import direct + garde-fou) ---- */
function integrateTournees(tours,srcName){
  if(!tours||!tours.length){ilog('❌ '+srcName+' : aucune tournée lisible (fichier ignoré)','err');return;}
  var day=tours[0].date?weekdayOf(tours[0].date):'';
  tours.forEach(function(t){
    var tm=TMAP[t.code];
    if(!tm){ilog('🆕 Nouvelle tournée '+t.code+' — '+t.name,'new');}
    t.clients.forEach(function(c){
      // client connu ?
      var known=DB.clients.find(function(x){return norm(x.n)===norm(c.dest);});
      if(!known){
        ilog('🆕 Nouveau client : '+c.dest+' ('+c.loc+') → '+t.code,'new');
      }else if(known.p!==t.code){
        ilog('⚠️ '+c.dest+' habituellement sur '+known.p+', vu sur '+t.code,'warn');
      }
      // commune connue ?
      var kc=DB.communes.find(function(x){return norm(x.n)===norm(c.loc);});
      if(!kc){ilog('📍 Nouvelle commune : '+c.loc+' (sur '+t.code+')','new');}
    });
    IMPORT.added++;
  });
  if(tours[0].date)ilog('✔ '+srcName+' : '+tours.length+' tournées importées — '+(day||'jour ?')+' '+tours[0].date,'ok');
}

async function handleFiles(files){
  IMPORT.log=[];IMPORT.added=0;
  for(var i=0;i<files.length;i++){
    var f=files[i],name=f.name,ext=(name.split('.').pop()||'').toLowerCase();
    try{
      if(ext==='csv'){
        var txt=await f.text();var rows=parseCSV(txt);
        ilog('✔ '+name+' : '+rows.length+' lignes CSV lues','ok');
        // (mapping CSV->tournées selon tes colonnes, à activer quand format connu)
      }else if(ext==='xlsx'){
        var rows2=await readXlsx(f);
        ilog('✔ '+name+' : '+rows2.length+' lignes Excel lues','ok');
      }else if(ext==='pdf'){
        var tours=await readPdfTournees(f);
        integrateTournees(tours,name);
      }else{
        ilog('❓ '+name+' : format non géré','warn');
      }
    }catch(e){
      ilog('❌ '+name+' : erreur de lecture ('+e.message+')','err');
    }
  }
  renderImportLog();
}
function renderImportLog(){
  var box=document.getElementById('importlog');if(!box)return;
  box.innerHTML=IMPORT.log.map(function(x){return '<div class="ilog '+x.c+'">'+x.m+'</div>';}).join('')
    ||'<div class="ilog">Aucun résultat.</div>';
  box.style.display='block';
}

/* ---- 6. WKD : annotation manuelle ---- */
var WKD_KEY='dispatch_wkd_annot';
function loadWkd(){try{return JSON.parse(localStorage.getItem(WKD_KEY)||'[]');}catch(e){return [];}}
function saveWkd(list){try{localStorage.setItem(WKD_KEY,JSON.stringify(list));}catch(e){}}
function addWkd(client){var l=loadWkd();if(l.indexOf(client)<0){l.push(client);saveWkd(l);}return l;}
function removeWkd(client){var l=loadWkd().filter(function(x){return x!==client;});saveWkd(l);return l;}


window.addEventListener('load',function(){
  var bt=document.getElementById('btImport'),ip=document.getElementById('importPanel'),
      ic=document.getElementById('iclose'),idrop=document.getElementById('idrop'),ifile=document.getElementById('ifile');
  if(bt)bt.onclick=function(){ip.classList.add('on');};
  if(ic)ic.onclick=function(){ip.classList.remove('on');document.getElementById('importlog').style.display='none';};
  if(ifile)ifile.addEventListener('change',function(e){handleFiles(e.target.files);});
  if(idrop){
    ['dragover','dragenter'].forEach(function(ev){idrop.addEventListener(ev,function(e){e.preventDefault();idrop.classList.add('over');});});
    ['dragleave','drop'].forEach(function(ev){idrop.addEventListener(ev,function(e){e.preventDefault();idrop.classList.remove('over');});});
    idrop.addEventListener('drop',function(e){handleFiles(e.dataTransfer.files);});
  }
});
